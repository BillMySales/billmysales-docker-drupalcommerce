; PHP overrides. Values come from environment variables set in compose.yaml.
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${UPLOAD_MAX_SIZE}
post_max_size = ${UPLOAD_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
allow_url_include = Off
expose_php = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600
date.timezone = ${TZ}
; Errors: never shown to visitors unless PHP_DISPLAY_ERRORS is on (development);
; always logged to stderr (docker compose logs). The official PHP image has no
; php.ini, and PHP's built-in default shows errors.
display_errors = ${PHP_DISPLAY_ERRORS}
display_startup_errors = ${PHP_DISPLAY_ERRORS}
log_errors = On
error_log = /dev/stderr
; OPcache: the image's opcache-recommended.ini caches only 4000 scripts;
; Drupal with Commerce and Drush has ~18000 PHP files.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; 0 (production): the code only changes with a new image (a new container).
; 1 (overrides/module.yaml): PHP checks files for changes on every request.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
